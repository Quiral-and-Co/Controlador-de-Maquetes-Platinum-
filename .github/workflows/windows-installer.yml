name: Windows 11 NSIS installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'traffic-bridge.js'
      - 'electron/**'
      - '.github/workflows/windows-installer.yml'
      - '**.js'
      - '**.html'
      - '**.css'
  pull_request:
    paths:
      - 'package.json'
      - 'traffic-bridge.js'
      - 'electron/**'
      - '.github/workflows/windows-installer.yml'
      - '**.js'
      - '**.html'
      - '**.css'

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build and report Windows 11 x64 NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      JMRI_TC_ENABLE_DCC: '0'
      JMRI_TC_SAFETY_VALIDATED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run reproducible final validation and build
        run: npm run validate:final

      - name: Upload installer and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: JMRI-TC-Gold-Custom-Final-Validation-Windows-11
          path: |
            dist/*.exe
            artifacts/final-validation/**
          if-no-files-found: error
          retention-days: 30
