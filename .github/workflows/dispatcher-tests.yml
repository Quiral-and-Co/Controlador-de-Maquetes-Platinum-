name: Dispatcher and editor tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check catalogue.js
          node --check dispatcher-core.js
          node --check dispatcher.js
          node --check traffic-core.js
          node --check safety-core.js
          node --check automation-core.js
          node --check traffic.js
          node --check traffic-bridge.js
      - name: Install local bridge dependencies
        run: npm install --no-audit --no-fund
      - name: Safety core tests
        run: node tests/safety.cjs
      - name: Safety bridge integration tests
        run: node tests/safety-bridge.cjs
      - name: Supervised timetable tests
        run: node tests/automation.cjs
      - name: Traffic state-machine tests
        run: node tests/traffic.cjs
      - name: Dispatcher unit tests
        run: node tests/dispatcher.cjs
      - name: Dispatcher UI integration tests
        run: node tests/dispatcher-ui.cjs
      - name: Editor regression tests
        run: node tests/smoke.cjs
      - name: Validate example JSON syntax
        run: node -e "JSON.parse(require('fs').readFileSync('config/layout.example.json', 'utf8')); console.log('PASS example JSON')"
